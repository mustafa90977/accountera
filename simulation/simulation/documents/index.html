<style>

  --ink:#86b4f0; --ink-soft:#1d2b3d; --on-ink:#0f141b; --stamp:#ff8f86; --ok:#6cc08f;
  --paper:#e9edf2; --paper-fg:#16222f; --paper-line:#b4c0cd; --paper-ink:#1b4f8f; --paper-stamp:#b3261e; --paper-muted:#566678; --paper-fill:#dde6f0;

*{box-sizing:border-box}

  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.wrap{max-width:1240px;margin-inline:auto}

.totals{margin-inline-start:auto;width:min(340px,100%);margin-top:6px}

.totals b{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;min-width:4em;text-align:left}
.words{margin:10px 0 2px;font-size:13px}

.terms{margin:10px 0 0;padding:0;list-style:none;font-size:12px;color:var(--paper-muted)}

.notes{margin:8px 0;font-size:13px}

.ck-no{text-align:left;font-size:12px;color:var(--paper-muted)}
.ck-no b{font-family:var(--f-num);color:var(--paper-stamp);font-size:17px;letter-spacing:.06em;margin-inline-start:6px}
.ck-row{display:flex;gap:10px;align-items:baseline;margin-top:14px;border-bottom:1px dotted var(--paper-muted);padding-bottom:3px}
.ck-row span{font-size:12px;color:var(--paper-muted);white-space:nowrap}

.ck-amount{border:2px solid var(--paper-ink);padding:6px 16px;font-family:var(--f-num);font-size:18px;font-weight:600;min-width:150px;min-height:44px;text-align:center}
.ck-sign{width:200px;text-align:center;font-size:12px;color:var(--paper-muted);border-top:1px solid var(--paper-fg);padding-top:3px}

.entry{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px}

.entry th{background:var(--ink-soft);border:1px solid var(--line);padding:5px 8px;text-align:center;font-weight:600}
.entry td{border:1px solid var(--line);padding:5px 10px}
.entry td.n{text-align:center;font-family:var(--f-num);font-variant-numeric:tabular-nums;width:18%}
.entry td.cr{padding-inline-start:30px}

.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:16px}

<script>
/* ---------- helpers ---------- */
const fmt=n=>{const f=Math.round(n*100)/100;return Number.isInteger(f)?f.toLocaleString('en-US'):f.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const TAX=0.14, TAXL='ضريبة القيمة المضافة 14% (نسبة افتراضية)';
const sum=(a,i)=>a.reduce((s,r)=>s+r[i],0);
function inv(items){const rows=items.map(([n,u,q,p],i)=>[i+1,n,u,q,p,q*p]);const sub=sum(rows,5);const tax=Math.round(sub*TAX*100)/100;return{rows,sub,tax,total:sub+tax}}
const ORG={name:'شركة الأمل التجارية',sub:'القاهرة — ب.ض 000-000-000 (بيانات افتراضية)'};
const SUP={name:'شركة النور للتوريدات',sub:'الجيزة — ب.ض 000-000-001 (بيانات افتراضية)'};
const CUS='شركة الفرح';
const PAPER='ورق طباعة A4 (رزمة 500 ورقة)';
const G={pur:'المشتريات',sal:'المبيعات',cash:'النقدية والبنوك',jrn:'القيود',exp:'فواتير المصروفات'};
const itemCols=['م','الصنف / البيان','الوحدة','الكمية','سعر الوحدة','القيمة'];
const itemNum=[3,4,5];
const money=(rows,extra)=>[['الإجمالي قبل الضريبة',sum(rows,5)],[TAXL,Math.round(sum(rows,5)*TAX*100)/100]];
const tot=(i,extra)=>[['الإجمالي قبل الضريبة',i.sub],[TAXL,i.tax],['الإجمالي المستحق',i.total,'g']];

const I_PO=inv([[PAPER,'رزمة',100,50]]);
const I_RET=inv([[PAPER+' — مرتجع','رزمة',10,50]]);
const I_SAL=inv([[PAPER,'رزمة',40,80]]);
const I_CN=inv([[PAPER+' — مرتجع','رزمة',5,80]]);
const PAID=I_PO.total-I_RET.total;         /* 5,130 */
const COLL=I_SAL.total-I_CN.total;         /* 3,192 */

const DOCS=[];
const add=o=>DOCS.push(o);

/* ===== المشتريات ===== */
add({id:'pr',g:'pur',t:'طلب شراء',en:'Purchase Requisition',serial:'0147',org:ORG,
 what:'طلب داخلي من المخازن أو أي إدارة إلى إدارة المشتريات تطلب فيه أصنافاً وكميات محددة.',
 who:'أمين المخزن أو الإدارة الطالبة، ويعتمده مدير المخازن',copies:'أصل لإدارة المشتريات + صورة للجهة الطالبة',rule:'لا يُسجل له قيد (طلب داخلي بلا أثر مالي).',lesson:'الدورة المستندية (03 مكرر)',
 meta:[['التاريخ','01/03/2026'],['الجهة الطالبة','المخازن'],['الأولوية','عادي'],['تاريخ الحاجة','10/03/2026']],
 table:{cols:['م','الصنف','الوحدة','الكمية المطلوبة','الرصيد الحالي','ملاحظات'],num:[3,4],rows:[[1,PAPER,'رزمة',100,12,'نفاد خلال أسبوعين']]},
 sigs:['أمين المخزن (الطالب)','مدير المخازن (اعتماد)','مدير المشتريات (استلام الطلب)'],entries:[]});
add({id:'rfq',g:'pur',t:'طلب عرض أسعار',en:'Request for Quotation',serial:'0059',org:ORG,
 what:'خطاب ترسله إدارة المشتريات لأكثر من مورد لطلب سعرهم وشروطهم قبل اختيار الأنسب.',
 who:'إدارة المشتريات',copies:'نسخة لكل مورد + نسخة في ملف الشراء',rule:'لا يُسجل له قيد.',lesson:'الدورة المستندية (03 مكرر)',
 meta:[['التاريخ','02/03/2026'],['آخر موعد لتقديم العرض','05/03/2026'],['مدة التوريد المطلوبة','7 أيام']],
 parties:[['إلى السادة',SUP.name,['الجيزة']],['من',ORG.name,['إدارة المشتريات']]],
 table:{cols:['م','الصنف / المواصفات','الوحدة','الكمية المطلوبة','سعر الوحدة (يملأه المورد)'],num:[3,4],rows:[[1,PAPER+' — 80 جم','رزمة',100,'']]},
 terms:['يُرجى ذكر مدة صلاحية العرض وشروط الدفع وتكلفة النقل.','تحتفظ الشركة بحق قبول أو رفض أي عرض دون إبداء أسباب.'],
 sigs:['مدير المشتريات','ختم المورد وتوقيعه'],entries:[]});
add({id:'po',g:'pur',t:'أمر شراء',en:'Purchase Order',serial:'0231',org:ORG,
 what:'تكليف رسمي للمورد المختار بتوريد أصناف بكميات وأسعار وشروط متفق عليها.',
 who:'إدارة المشتريات بعد اعتماد المدير',copies:'أصل للمورد + صورة للمخازن + صورة للحسابات',rule:'لا يُسجل له قيد، فهو التزام مستقبلي لم تنتقل به الملكية.',lesson:'الدورة المستندية (03 مكرر)',
 meta:[['التاريخ','03/03/2026'],['مرجع عرض السعر','ع/2026/18'],['شروط الدفع','آجل 30 يوماً'],['موعد التسليم','10/03/2026']],
 parties:[['المورد',SUP.name,[SUP.sub]],['جهة التسليم',ORG.name,['مخزن القاهرة الرئيسي']]],
 table:{cols:itemCols,num:itemNum,rows:I_PO.rows},totals:tot(I_PO),
 terms:['يُقبل التسليم بعد الفحص ومطابقة المواصفات المذكورة.','يُرفق إذن الاستلام برقم أمر الشراء مع الفاتورة.'],
 sigs:['أعده: إدارة المشتريات','اعتمده: المدير المالي','استلمه المورد'],entries:[]});
add({id:'grn',g:'pur',t:'إذن استلام مخزني',en:'Goods Received Note',serial:'0318',org:ORG,
 what:'يثبت أن أمين المخزن استلم البضاعة فعلاً بعد فحصها ومطابقتها لأمر الشراء.',

 meta:[['تاريخ الاستلام','10/03/2026'],['رقم أمر الشراء','0231'],['رقم فاتورة المورد','ن/5521'],['المخزن','القاهرة الرئيسي']],
 parties:[['المورد',SUP.name,['المندوب: سامي (اسم افتراضي)']]],
 table:{cols:['م','الصنف','الوحدة','الكمية بأمر الشراء','الكمية المستلمة','المقبول','المرفوض'],num:[3,4,5,6],rows:[[1,PAPER,'رزمة',100,100,100,0]]},
 notes:[['ملاحظات الفحص','مطابق ظاهرياً للمواصفات، والفحص التفصيلي يتم خلال 48 ساعة']],
 sigs:['أمين المخزن','لجنة الفحص','مندوب المورد'],entries:[]});

/* ---------- rendering ---------- */
const $=id=>document.getElementById(id);
let mode='filled', cur=0;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cell=(v,isNum)=>typeof v==='number'?fmt(v):esc(v);

function paperGeneric(d,blank){
  const filled=!blank;
  let h='<article class="paper"><header class="p-head"><div class="p-org"><b>'+esc(d.org.name)+'</b><small>'+esc(d.org.sub)+'</small></div>'+
   '<div class="p-title"><h2>'+esc(d.t)+'</h2><span>'+esc(d.en)+'</span></div>'+
   '<div class="p-serial"><small>الرقم المسلسل</small><b>'+(filled?esc(d.serial):'N° ______')+'</b></div></header>';
  if(d.meta) h+='<div class="p-meta">'+d.meta.map(m=>'<div class="fld"><span>'+esc(m[0])+'</span><b>'+(filled?esc(m[1]):'')+'</b></div>').join('')+'</div>';
  if(d.parties) h+='<div class="p-parties">'+d.parties.map(p=>'<div class="party"><h4>'+esc(p[0])+'</h4><p class="nm">'+(filled?esc(p[1]):'')+'</p>'+p[2].map(l=>'<p>'+(filled?esc(l):'')+'</p>').join('')+'</div>').join('')+'</div>';
  if(d.table){const t=d.table,num=t.num||[];
    h+='<table class="pt"><thead><tr>'+t.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
    if(filled){t.rows.forEach((r,ri)=>{const last=t.totalRow&&ri===t.rows.length-1;h+='<tr'+(last?' class="tot"':'')+'>'+r.map((v,i)=>'<td class="'+(num.includes(i)?'n':(i===0?'c':''))+'">'+cell(v)+'</td>').join('')+'</tr>'});}
    else{for(let k=0;k<(t.blank||5);k++)h+='<tr>'+t.cols.map(()=>'<td></td>').join('')+'</tr>';}
    h+='</tbody></table>';}
  if(d.totals) h+='<div class="totals">'+d.totals.map(t=>'<div class="'+(t[2]||'')+'"><span>'+esc(t[0])+'</span><b>'+(filled?fmt(t[1]):'')+'</b></div>').join('')+'</div>';
  if(d.words) h+='<p class="words"><span>المبلغ كتابةً:</span> <b>'+(filled?esc(d.words):'&nbsp;')+'</b></p>';
  if(d.notes) h+='<div class="notes">'+d.notes.map(n=>'<p><b>'+esc(n[0])+':</b> '+(filled?esc(n[1]):'')+'</p>').join('')+'</div>';
  if(d.terms) h+='<ul class="terms">'+d.terms.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>';
  if(d.sigs) h+='<div class="sigs">'+d.sigs.map(s=>'<div class="sig"><i></i>'+esc(s)+'</div>').join('')+'</div>';
  h+='<footer class="p-foot"><span>نموذج تعليمي — بيانات افتراضية</span><span>'+esc(d.en)+'</span></footer></article>';
  return h;
}
function paperCheque(d,blank){
  const f=d.f,F=!blank;
  return '<article class="paper cq"><div class="cheque"><div class="ck-top"><div class="ck-bank"><b>'+esc(f.bank)+'</b><small>'+(F?esc(f.acc):'حساب جاري رقم ______')+'</small></div>'+
  '<div class="ck-no">شيك رقم <b>'+(F?esc(d.serial):'______')+'</b></div></div>'+
  '<div class="ck-row"><span>التاريخ</span><b>'+(F?esc(f.date):'')+'</b></div>'+
  '<div class="ck-row"><span>ادفعوا لأمر</span><b>'+(F?esc(f.payee):'')+'</b></div>'+
  '<div class="ck-row"><span>مبلغ وقدره</span><b>'+(F?esc(f.words):'')+'</b></div>'+
  '<div class="ck-row"><span>البيان</span><b>'+(F?esc(f.memo):'')+'</b></div>'+
  '<div class="ck-foot"><div class="ck-amount">'+(F?esc(f.amt):'')+'</div><div class="ck-sign">توقيع الساحب — '+esc(ORG.name)+'</div></div></div>'+
  '<footer class="p-foot"><span>نموذج تعليمي — بيانات افتراضية</span><span>Cheque</span></footer></article>';
}
function entryHTML(d){
  if(!d.entries.length) return '<h3>القيد المحاسبي</h3><p class="rule">'+esc(d.rule)+'</p>';
  let h='<h3>القيد المحاسبي الناتج</h3>';
  d.entries.forEach(e=>{
    const D=e.lines.filter(l=>l[0]==='d').reduce((s,l)=>s+l[2],0),C=e.lines.filter(l=>l[0]==='c').reduce((s,l)=>s+l[2],0);
    h+='<p class="when">'+esc(e.when)+'</p><div class="scroll"><table><thead><tr><th>مدين</th><th>دائن</th><th>البيان</th></tr></thead><tbody>'+
    e.lines.map(l=>l[0]==='d'?'<tr><td class="n">'+fmt(l[2])+'</td><td class="n"></td><td>من ح/ '+esc(l[1])+'</td></tr>':'<tr><td class="n"></td><td class="n">'+fmt(l[2])+'</td><td class="cr">إلى ح/ '+esc(l[1])+'</td></tr>').join('')+
    '<tr><td class="n"><b>'+fmt(D)+'</b></td><td class="n"><b>'+fmt(C)+'</b></td><td><b>'+(Math.abs(D-C)<0.005?'الجانبان متساويان':'غير متوازن')+'</b></td></tr></tbody></table></div>';
  });
  return h+'<p class="rule">'+esc(d.rule)+'</p>';
}
function render(){
  const d=DOCS[cur],blank=mode==='blank';
  $('crumb').textContent=G[d.g]+' / '+d.t;
  $('what').innerHTML='<h2>'+esc(d.t)+'</h2><p>'+esc(d.what)+'</p><dl class="facts"><div><dt>من يعدّه</dt><dd>'+esc(d.who)+'</dd></div><div><dt>النسخ</dt><dd>'+esc(d.copies)+'</dd></div><div><dt>درس مرتبط</dt><dd>'+esc(d.lesson)+'</dd></div></dl>';
  $('sheet').innerHTML=d.kind==='cheque'?paperCheque(d,blank):paperGeneric(d,blank);
  $('entry').innerHTML=entryHTML(d);
  const p=DOCS[cur-1],n=DOCS[cur+1];
  $('nav2').innerHTML=(p?'<a href="#doc-'+p.id+'"><small>→ السابق</small>'+esc(p.t)+'</a>':'<span></span>')+(n?'<a class="n" href="#doc-'+n.id+'"><small>التالي ←</small>'+esc(n.t)+'</a>':'');
  $('mFilled').setAttribute('aria-pressed',String(!blank));$('mBlank').setAttribute('aria-pressed',String(blank));
  document.querySelectorAll('#side a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#doc-'+d.id?'page':'false'));
  $('pickSel').value=d.id;
}
function build(){
  $('lead').textContent=DOCS.length+' نموذجاً لكل مستند في دورات المشتريات والمبيعات والنقدية والمصروفات، كل واحد بمثال معبّأ ونموذج فارغ والقيد المحاسبي الذي يخرج منه. كل الأسماء والأرقام والجهات افتراضية للتدريب.';
  let side='',sel='';
  Object.keys(G).forEach(g=>{
    const ds=DOCS.filter(d=>d.g===g);
    side+='<h3>'+G[g]+'</h3>'+ds.map(d=>'<a href="#doc-'+d.id+'">'+esc(d.t)+'<small>'+esc(d.serial)+'</small></a>').join('');
    sel+='<optgroup label="'+G[g]+'">'+ds.map(d=>'<option value="'+d.id+'">'+esc(d.t)+'</option>').join('')+'</optgroup>';
  });
  $('side').innerHTML=side;$('pickSel').innerHTML=sel;
}
function route(){const id=(location.hash.match(/^#doc-([a-z]+)$/)||[])[1];const i=DOCS.findIndex(d=>d.id===id);cur=i>=0?i:0;render();}
$('mFilled').onclick=()=>{mode='filled';render()};
$('mBlank').onclick=()=>{mode='blank';render()};
$('pickSel').onchange=e=>{location.hash='doc-'+e.target.value};
window.addEventListener('hashchange',route);
build();route();
</script>
