<body>
  <div class="app-wrapper">
    <!-- 1. الشريط العلوي المتجاوب (Topbar) -->

      <div class="topbar-container">
        <div style="display: flex; align-items: center; gap: 0.5rem; min-width: 0;">

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="brand-wrapper" onclick="navigateToScreen('landing')">
            <div class="brand-icon" style="background:transparent; padding:0; box-shadow:none; width:auto; height:auto;">
            <svg width="38" height="38" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="accountera-brandmark">
              <defs>
                <linearGradient id="accBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#047857" />
                  <stop offset="50%" stop-color="#10B981" />
                  <stop offset="100%" stop-color="#06B6D4" />
                </linearGradient>
              </defs>
              <rect width="40" height="40" rx="11" fill="url(#accBrandGrad)"/>
              <path d="M12 28V15C12 13.8954 12.8954 13 14 13C15.1046 13 16 13.8954 16 15V28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
              <path d="M24 28V15C24 13.8954 24.8954 13 26 13C27.1046 13 28 13.8954 28 15V28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
              <path d="M14 20H26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
              <circle cx="20" cy="11" r="2.5" fill="#FFFFFF"/>
              <path d="M17 28H23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">ACCOUNTERA</span>
            <span class="brand-badge-role">ACCOUNTING SUITE</span>
          </div>
        </div>
      </div>

        <div class="topbar-actions">
          <!-- زر تبديل اللغة (عربي / English) -->
          <button id="langToggleBtn" onclick="toggleLanguage()" class="btn-cta-secondary" style="padding: 0 10px; height: 38px; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; cursor: pointer;" title="التحويل إلى اللغة الإنجليزية (Switch to English)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>

          </button>

          <div id="topbarAuthDock"></div>
        </div>
      </div>

    <div class="app-body-container">
      <aside class="accountely-sidebar" id="appSidebar" style="display: none;">
        <div class="sidebar-header">

            </span>
          </button>
        </div>

        <nav class="sidebar-menu">

          <div class="sidebar-group-label" style="padding: 0.5rem 0.75rem 0.25rem; font-size: 0.68rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">
            رحلة التعلّم والتطبيق
          </div>

          <!-- 1. الرئيسية والمتابعة -->
          <button class="sidebar-item active" id="sb-student-dashboard" onclick="navigateToScreen('student-dashboard')" title="لوحة المتابعة والنشاط اليومي">

            <span class="sidebar-text" data-i18n="nav_overview">الرئيسية والمتابعة</span>

          <button class="sidebar-item" id="sb-documentary-cycle" onclick="navigateToScreen('documentary-cycle')" title="أكاديمية المحاسبة والمنهج الشامل (38 درساً)">

              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </span>
            <span class="sidebar-text" data-i18n="nav_theory">الأكاديمية والدروس</span>
            <span class="sidebar-badge" style="background: var(--primary-light, rgba(16,185,129,0.12)); color: var(--primary); font-size: 0.7rem; font-weight: 800; padding: 1px 6px; border-radius: 6px;">38</span>
          </button>

            </span>
            <span class="sidebar-text" data-i18n="nav_progress">تقدّمي ومحفظتي</span>

            </span>
            <span class="sidebar-text" data-i18n="nav_plans">باقات التدريب</span>
          </button>

          <button class="sidebar-item" id="sb-student-settings" onclick="navigateToScreen('student-settings')" title="إعدادات الحساب والبيانات الشخصية">
            <span class="sidebar-icon">

      <main class="main-content" id="app">

        </span>

        </span>
        <span>المحاكاة</span>
      </button>
      <button class="bottom-nav-item" id="bn-portfolio" onclick="navigateToScreen('portfolio')">
        <span class="bn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
