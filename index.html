<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>منصة المحاسب المبتدئ | Accountera</title>
  <meta name="description" content="منصة تفاعلية متكاملة للمحاسب المبتدئ لتعلم تسجيل قيود اليومية وتحليل المعاملات المالية.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  
  <!-- الخطوط الرسمية القياسية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- تجميع التنسيقات المتجاوبة ونظام الثيم المركزي -->
  <link rel="stylesheet" href="css/theme/theme.css?v=2.0">
  <link rel="stylesheet" href="css/base/tokens.css?v=2.0">
  <link rel="stylesheet" href="css/base/reset.css?v=2.3">
  <link rel="stylesheet" href="css/base/typography.css?v=2.0">
  <link rel="stylesheet" href="css/layout/app-shell.css?v=2.0">
  <link rel="stylesheet" href="css/layout/topbar.css?v=2.0">
  <link rel="stylesheet" href="css/layout/bottom-nav.css?v=2.0">
  <link rel="stylesheet" href="css/components/buttons.css?v=2.0">
  <link rel="stylesheet" href="css/components/cards.css?v=2.0">
  <link rel="stylesheet" href="css/components/modals.css?v=2.0">
  <link rel="stylesheet" href="css/components/forms.css?v=2.0">
  <link rel="stylesheet" href="css/views/landing.css?v=2.3">
  <link rel="stylesheet" href="css/views/learning.css?v=2.0">
  <link rel="stylesheet" href="css/views/practice.css?v=2.0">
  <link rel="stylesheet" href="css/views/company-workspace.css?v=2.0">
  <link rel="stylesheet" href="css/views/admin-dashboard.css?v=2.0">
  <link rel="stylesheet" href="css/views/student-dashboard.css?v=2.0">
  <link rel="stylesheet" href="css/views/accountely-theme.css?v=2.0">
</head>
<body>
  <div class="app-wrapper">
    <!-- 1. الشريط العلوي المتجاوب (Topbar) -->
    <header class="topbar">
      <div class="topbar-container">
        <div class="brand-wrapper" onclick="navigateToScreen('landing')">
          <div class="brand-icon" style="background:transparent; padding:0; box-shadow:none; width:auto; height:auto;">
            <svg width="38" height="38" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="accountera-brandmark">
              <defs>
                <linearGradient id="accBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#047857" />
                  <stop offset="50%" stop-color="#10B981" />
                  <stop offset="100%" stop-color="#06B6D4" />
                </linearGradient>
              </defs>
              <rect width="40" height="40" rx="11" fill="url(#accBrandGrad)"/>
              <path d="M12 28V15C12 13.8954 12.8954 13 14 13C15.1046 13 16 13.8954 16 15V28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
              <path d="M24 28V15C24 13.8954 24.8954 13 26 13C27.1046 13 28 13.8954 28 15V28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
              <path d="M14 20H26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
              <circle cx="20" cy="11" r="2.5" fill="#FFFFFF"/>
              <path d="M17 28H23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">ACCOUNTERA</span>
            <span class="brand-badge-role">ACCOUNTING SUITE</span>
          </div>
        </div>

        <div class="topbar-actions">
          <!-- زر تبديل الثيم السريع (ليلي / نهاري) -->
          <button id="themeToggleBtn" onclick="toggleTheme()" class="btn-cta-secondary" style="padding: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%;" title="تبديل الوضع الليلي / النهاري">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          
          <!-- حوض الدخول / الملف الشخصي للمستخدم بنمط Accountely -->
          <div id="topbarAuthDock"></div>
        </div>
      </div>
    </header>

    <!-- 2. جسم التطبيق مع الشريط الجانبي Accountely-Style -->
    <div class="app-body-container">
      <aside class="accountely-sidebar" id="appSidebar" style="display: none;">
        <div class="sidebar-header">
          <span class="sidebar-nav-title">التنقل / NAVIGATION</span>
          <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="طي/فتح القائمة">
            <span id="sidebarToggleIcon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </span>
          </button>
        </div>

        <nav class="sidebar-menu">
          <button class="sidebar-item active" id="sb-student-dashboard" onclick="navigateToScreen('student-dashboard')">
            <span class="sidebar-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 16v-4"/><path d="M12 16v-8"/><path d="M17 16v-6"/></svg>
            </span>
            <span class="sidebar-text">Overview • لوحة المتابعة</span>
          </button>
          <button class="sidebar-item" id="sb-portfolio" onclick="navigateToScreen('portfolio')">
            <span class="sidebar-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
            </span>
            <span class="sidebar-text">Progress • مستوى التقدم</span>
          </button>
          <button class="sidebar-item" id="sb-journal" onclick="if(typeof AuthService !== 'undefined' && AuthService.getCurrentUser()){ window.location.href='simulation/simulation/journal/index.html'; } else { if(typeof AccModal !== 'undefined') AccModal.toast('يرجى تسجيل الدخول أولاً', 'info'); AuthService.openAuthModal('login'); }">
            <span class="sidebar-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </span>
            <span class="sidebar-text">Submissions • سجل القيود</span>
          </button>
          <button class="sidebar-item" id="sb-student-settings" onclick="navigateToScreen('student-settings')">
            <span class="sidebar-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <span class="sidebar-text">Profile • الملف الشخصي</span>
          </button>
          <button class="sidebar-item" id="sb-student-plans" onclick="navigateToScreen('student-plans')">
            <span class="sidebar-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            </span>
            <span class="sidebar-text">Refer & Earn • الباقات</span>
          </button>

          <div class="sidebar-divider"></div>

          <button class="sidebar-item" id="sb-ip-1" onclick="navigateToScreen('ip-1')">
            <span class="sidebar-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            </span>
            <span class="sidebar-text">Daily Tasks • المهام اليومية</span>
            <span class="sidebar-dot-badge"></span>
          </button>
          <button class="sidebar-item" id="sb-companies-hub" onclick="navigateToScreen('companies-hub')">
            <span class="sidebar-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><line x1="8" y1="6" x2="8.01" y2="6"/><line x1="16" y1="6" x2="16.01" y2="6"/><line x1="8" y1="10" x2="8.01" y2="10"/><line x1="16" y1="10" x2="16.01" y2="10"/></svg>
            </span>
            <span class="sidebar-text">Challenges • بيئة الشركات</span>
          </button>
          <button class="sidebar-item" id="sb-ex-1" onclick="navigateToScreen('ex-1')">
            <span class="sidebar-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </span>
            <span class="sidebar-text">MCQ Quiz • الاختبارات الفنية</span>
          </button>
        </nav>
      </aside>

      <!-- منطقة المحتوى التفاعلي المتغير -->
      <main class="main-content" id="app">
        <!-- يتم حقن الشاشة النشطة ديناميكياً هنا -->
      </main>
    </div>

    <!-- 3. القائمة السفلية للموبايل (Mobile Bottom Navigation) -->
    <nav class="bottom-nav">
      <button class="bottom-nav-item active" id="bn-landing" onclick="navigateToScreen('landing')">
        <span class="bn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        <span>الرئيسية</span>
      </button>
      <button class="bottom-nav-item" id="bn-student-dashboard" onclick="navigateToScreen('student-dashboard')">
        <span class="bn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 3 3 5 6 5s6-2 6-5v-5"/></svg>
        </span>
        <span>لوحتي</span>
      </button>
      <button class="bottom-nav-item" id="bn-lesson-1" onclick="navigateToScreen('lesson-1')">
        <span class="bn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </span>
        <span>الدروس</span>
      </button>
      <button class="bottom-nav-item" id="bn-companies-hub" onclick="navigateToScreen('companies-hub')">
        <span class="bn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/></svg>
        </span>
        <span>الشركات</span>
      </button>
    </nav>
  </div>

  <!-- Supabase CDN & Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="src/core/supabase-client.js?v=2.1"></script>
  <script src="src/core/services/learning-service.js?v=2.1"></script>
  
  <!-- ملفات النواة المحاسبية المستقلة (Accounting Core & COA) -->
  <script src="src/core/engine/egyptian-coa.js?v=2.1"></script>
  <script src="src/core/engine/accountera-accounting-core.js?v=2.1"></script>
  <script src="src/core/engine/document-transaction-engine.js?v=2.1"></script>
  <script src="src/core/engine/egyptian-simulation-modules.js?v=2.1"></script>
  <script src="src/core/engine/career-paths-and-mentor.js?v=2.1"></script>

  <!-- ملفات الواجهة والمصادقة والمنطق -->
  <script src="src/ui/icons.js?v=2.1"></script>
  <script src="src/core/default-company-data.js?v=2.1"></script>
  <script src="src/core/auth.js?v=2.8"></script>
  <script src="src/core/simulation-bridge.js?v=2.1"></script>
  <script src="src/ui/landing-view.js?v=2.2"></script>
  <script src="src/ui/auth-view.js?v=2.8"></script>
  <script src="src/ui/learning-view.js?v=2.1"></script>
  <script src="src/ui/practice-view.js?v=2.1"></script>
  <script src="src/ui/company-workspace-view.js?v=2.1"></script>
  <script src="src/ui/student-dashboard-view.js?v=2.1"></script>
  <script src="src/ui/student-settings-view.js?v=2.5"></script>
  <script src="src/ui/student-plans-view.js?v=2.5"></script>
  <script src="src/ui/professional-portfolio-view.js?v=2.1"></script>
  <script src="src/ui/teacher-dashboard-view.js?v=2.1"></script>
  <script src="src/ui/admin-dashboard-view.js?v=2.5"></script>
  <script src="src/main.js?v=2.8"></script>
</body>
</html>
